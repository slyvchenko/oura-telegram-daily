name: Daily Oura Report

on:
  workflow_dispatch:
  # schedule disabled: every scheduled run has been failing with
  # "Missing required environment variables" because the Oura/Telegram
  # secrets aren't set in this repo. Re-add the cron block below once the
  # secrets are configured (Settings -> Secrets and variables -> Actions).
  # schedule:
  #   - cron: "0 6,7,8,9 * * *"

permissions:
  contents: write

concurrency:
  group: daily-oura-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check local schedule window
        id: schedule
        shell: bash
        run: |
          LOCAL_HOUR=$(TZ=Europe/Warsaw date +%H)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" || "$LOCAL_HOUR" == "08" || "$LOCAL_HOUR" == "09" || "$LOCAL_HOUR" == "10" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.schedule.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.schedule.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Fetch Oura data and send Telegram report
        if: steps.schedule.outputs.run == 'true'
        env:
          OURA_CLIENT_ID: ${{ secrets.OURA_CLIENT_ID }}
          OURA_CLIENT_SECRET: ${{ secrets.OURA_CLIENT_SECRET }}
          OURA_REFRESH_TOKEN: ${{ secrets.OURA_REFRESH_TOKEN }}
          OURA_REFRESH_TOKEN_FILE: .oura_refresh_token
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TIMEZONE: Europe/Warsaw
        run: python -m src.main

      - name: Rotate Oura refresh token in GitHub Secrets
        if: steps.schedule.outputs.run == 'true' && hashFiles('.oura_refresh_token') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_SECRET_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "GH_SECRET_TOKEN is missing; cannot persist Oura's single-use refresh token." >&2
            exit 1
          fi
          gh secret set OURA_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < .oura_refresh_token
          rm -f .oura_refresh_token

      - name: Persist sent-state
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          if git diff --quiet -- data/last_sent.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/last_sent.json
          git commit -m "chore: record daily Oura report"
          git push
